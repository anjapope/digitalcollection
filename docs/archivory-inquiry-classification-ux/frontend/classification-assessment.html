<section class="aic-assessment" data-aic-assessment hidden aria-labelledby="aic-heading">
  <div class="aic-assessment-header">
    <div><p class="aic-kicker">Inquiry Assessment</p><h3 id="aic-heading">How this question fits the exhibit</h3></div>
    <span class="aic-bin-badge" data-aic-bin-label></span>
  </div>
  <div class="aic-grid-wrap">
    <div class="aic-quadrant" role="img" aria-label="Relevance and answerability quadrant">
      <div class="aic-cell" data-aic-cell="relevant_answerable"><strong>Relevant</strong><span>Answerable</span></div>
      <div class="aic-cell" data-aic-cell="not_relevant_answerable"><strong>Not Relevant</strong><span>Answerable</span></div>
      <div class="aic-cell" data-aic-cell="relevant_not_answerable"><strong>Relevant</strong><span>Not Answerable</span></div>
      <div class="aic-cell" data-aic-cell="not_relevant_not_answerable"><strong>Not Relevant</strong><span>Not Answerable</span></div>
    </div>
    <div class="aic-diagnostics">
      <div class="aic-metric"><div class="aic-metric-row"><span>Relevance</span><strong data-aic-relevance-label></strong></div><div class="aic-meter"><span data-aic-relevance-meter></span></div><p data-aic-relevance-reason></p></div>
      <div class="aic-metric"><div class="aic-metric-row"><span>Answerability</span><strong data-aic-answerability-label></strong></div><div class="aic-meter"><span data-aic-answerability-meter></span></div><p data-aic-answerability-reason></p></div>
      <div class="aic-metric"><div class="aic-metric-row"><span>Inquiry Originality</span><strong data-aic-originality-label></strong></div><div class="aic-meter"><span data-aic-originality-meter></span></div><p data-aic-originality-reason></p></div>
    </div>
  </div>
  <aside class="aic-bin-explanation"><h4 data-aic-bin-heading></h4><p data-aic-bin-description></p></aside>
</section>
